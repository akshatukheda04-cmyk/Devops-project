services:
  app:
    build: .
    container_name: college-event-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/campus_planner.db
      TZ: Asia/Kolkata
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    networks:
      - event-monitoring

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: college-event-prometheus
    # Use Prometheus's numeric nobody UID to avoid Docker user-name lookup issues.
    user: "65534:65534"
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - event-monitoring

  grafana:
    image: grafana/grafana:12.1.1
    container_name: college-event-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-this-before-use}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - event-monitoring

volumes:
  prometheus-data:
  grafana-data:

networks:
  event-monitoring:
